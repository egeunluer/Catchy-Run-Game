[project]
name = "catchy_run"
version = "0.1.0"
description = "Two-agent adversarial grid game (7x7). Engine kept Gymnasium-friendly for later DRL wrapping."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pygame>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
catchy_run_game = "catchy_run_game.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["catchy_run_game*", "rl_agent*"]
